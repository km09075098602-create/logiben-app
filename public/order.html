<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ロジ弁 お弁当の注文</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div><h1>🍱 ロジ弁</h1><div class="who" id="who"></div></div>
    <button type="button" id="logout">ログアウト</button>
  </header>
  <main>
    <!-- 今月の利用状況 -->
    <div id="usage"></div>

    <h2>お届け日を選ぶ</h2>
    <div class="dates" id="dates"></div>

    <div id="day"></div>

    <!-- LINE連携(LINE公式アカウントの設定がされているときだけ表示) -->
    <div id="line" style="margin-top:24px"></div>
  </main>

  <script type="module">
    import { api, yen, dateLabel, deadlineLabel, esc, logout, toast } from '/common.js';

    let selected = null; // 選んでいる日付

    document.getElementById('logout').onclick = logout;

    /** "2027-02-01" → "2027年2月1日" */
    const jpDate = (d) => d.replace(/^(\d+)-0?(\d+)-0?(\d+)$/, '$1年$2月$3日');

    async function loadSummary() {
      const s = await api('/api/employee/summary');
      const pct = Math.min(100, Math.round((s.used / s.cap) * 100));
      let notice = '';
      if (s.reached) {
        notice = `<div class="notice danger">今月の会社負担は上限に達しました。今月の残りのお弁当は全額ご自身の負担になります(だるまランチも同じです)。</div>`;
      } else if (s.warn) {
        notice = `<div class="notice warn">今月の会社負担が上限の${s.warn_percent}%を超えました(残り ${yen(s.remaining)}・税抜)。上限に達すると、その月の残りは全額ご自身の負担になります。</div>`;
      }
      const myTotal = s.orders.reduce((a, o) => a + o.employee_share, 0);
      const lunchCount = s.orders.filter((o) => o.kind === 'daruma_lunch').length;
      document.getElementById('usage').innerHTML = `
        ${notice}
        <div class="card">
          <div class="sub">${Number(s.month.slice(5))}月の会社負担(上限 ${yen(s.cap)}・税抜き)</div>
          <div class="meter ${s.reached ? 'full' : s.warn ? 'warn' : ''}"><div style="width:${pct}%"></div></div>
          <div style="display:flex;justify-content:space-between;font-size:.9rem">
            <span>使用 ${yen(s.used)}(${pct}%)</span><span>残り <b>${yen(s.remaining)}</b></span>
          </div>
          <div class="sub">今月のご利用 ${s.orders.length}食${lunchCount ? `(うちだるまランチ ${lunchCount}回)` : ''} ・ あなたのお支払い 合計 ${yen(myTotal)}</div>
          ${s.points.enabled ? `<div class="points">🎁 ポイント <b>${s.points.balance}</b> pt
            ${s.points.pending.map((p) => `<span class="sub">・${jpDate(p.date)}に <b>${p.amount}pt</b> もらえます</span>`).join('')}
            <div class="sub">1回の利用で${s.points.per_use}pt(その月の利用分を、次の月の給料日の翌日にまとめてお渡し)${s.points.next_expiry ? `・${jpDate(s.points.next_expiry.date)}に${s.points.next_expiry.amount}ptが期限切れ` : ''}</div></div>` : ''}
        </div>
        <a class="btn secondary" href="/lunch.html" style="display:block;text-align:center;margin-bottom:12px">🍜 だるまランチを使う(お店で食べるとき)</a>`;
      renderLine(s);
      const ordered = new Set(s.orders.filter((o) => o.kind === 'bento').map((o) => o.delivery_date));
      if (!selected) selected = (s.dates.find((d) => d.open) || s.dates[0])?.date;
      document.getElementById('dates').innerHTML = s.dates
        .map(
          (d) => `<button type="button" data-date="${d.date}" class="${d.date === selected ? 'active' : ''} ${d.open ? '' : 'closed'}">
            ${dateLabel(d.date)}<small>${ordered.has(d.date) ? '注文済み ✓' : d.open ? '受付中' : '締切'}</small></button>`
        )
        .join('');
      document.querySelectorAll('#dates button').forEach((b) =>
        b.addEventListener('click', () => {
          selected = b.dataset.date;
          refresh();
        })
      );
    }

    async function loadDay() {
      const m = await api('/api/employee/menu?date=' + selected);
      const el = document.getElementById('day');
      const head = `<h2>${dateLabel(m.date)} のお弁当</h2>
        <p class="sub">${m.open ? `締め切り:${deadlineLabel(m.deadline)}(それまでは変更・取り消しできます)` : 'この日の注文は締め切りました'}</p>
        ${m.shops_closed.length ? `<p class="sub">この日は ${m.shops_closed.map(esc).join('・')} がお休みです。</p>` : ''}
        ${m.open && m.points.enabled && m.points.balance > 0
          ? `<label class="check points-use"><input type="checkbox" id="use-points"> ポイントを使う(残り ${m.points.balance}pt・1回 ${m.points.max_per_order}ptまで。使った分を引いてから会社と半分ずつ)</label>`
          : ''}`;
      const current = m.current
        ? `<div class="card current">
            <div class="sub">ご注文中</div>
            <div style="font-weight:700">${esc(m.current.item_name)}</div>
            <div>お弁当代 ${yen(m.current.price)}${m.current.points_used ? ` − ポイント ${m.current.points_used}pt` : ''} → 会社負担 ${yen(m.current.company_share)} / <b>あなた ${yen(m.current.employee_share)}</b></div>
            ${m.open ? '<p style="margin:8px 0 0"><button type="button" class="secondary" id="cancel">この日の注文を取り消す</button></p>' : ''}
          </div>`
        : '';
      // お店ごとにまとめる
      const byShop = {};
      for (const it of m.items) (byShop[it.shop_name] ||= []).push(it);
      const menu = Object.entries(byShop)
        .map(
          ([shop, items]) => `<div class="card"><div class="shop-name">${esc(shop)}</div>
          ${items
            .map(
              (it) => `<div class="item ${m.current?.menu_item_id === it.id ? 'selected' : ''}">
                <div><div class="name">${esc(it.name)}</div><div class="sub">${esc(it.description || '')}</div></div>
                <div class="price">
                  <div class="sub">${yen(it.price)}</div>
                  <div>あなた <strong>${yen(it.employee_share)}</strong></div>
                  ${m.open && m.current?.menu_item_id !== it.id ? `<button type="button" data-id="${it.id}" data-name="${esc(it.name)}" style="margin-top:4px;padding:6px 14px">${m.current ? '変更' : '注文'}</button>` : ''}
                </div>
              </div>`
            )
            .join('')}</div>`
        )
        .join('');
      el.innerHTML = head + current + (m.open || !m.current ? menu : '');

      el.querySelectorAll('button[data-id]').forEach((b) =>
        b.addEventListener('click', async () => {
          const usePoints = !!document.getElementById('use-points')?.checked;
          if (!confirm(`${dateLabel(selected)} に「${b.dataset.name}」を注文しますか?${usePoints ? '\n(ポイントを使います)' : ''}`)) return;
          try {
            await api('/api/employee/orders', { method: 'POST', body: { date: selected, menu_item_id: Number(b.dataset.id), use_points: usePoints } });
            toast('注文しました');
            refresh();
          } catch (e) { toast(e.message, true); }
        })
      );
      document.getElementById('cancel')?.addEventListener('click', async () => {
        if (!confirm(`${dateLabel(selected)} の注文を取り消しますか?`)) return;
        try {
          await api('/api/employee/orders/' + selected, { method: 'DELETE' });
          toast('取り消しました');
          refresh();
        } catch (e) { toast(e.message, true); }
      });
    }

    /** LINEで注文するための連携 */
    function renderLine(s) {
      const el = document.getElementById('line');
      if (!s.line_enabled) return (el.innerHTML = '');
      if (s.line_linked) {
        el.innerHTML = `<div class="card"><b>LINEと連携済みです ✓</b>
          <p class="sub" style="margin:4px 0 8px">LINEのロジ弁公式アカウントから、注文・確認・取り消しができます。</p>
          <button type="button" class="secondary small" id="line-unlink">連携を解除する</button></div>`;
        document.getElementById('line-unlink').onclick = async () => {
          if (!confirm('LINEとの連携を解除しますか?')) return;
          await api('/api/employee/line', { method: 'DELETE' });
          toast('連携を解除しました');
          loadSummary();
        };
        return;
      }
      el.innerHTML = `<div class="card"><b>LINEでも注文できます</b>
        <ol class="sub" style="padding-left:1.3em;margin:6px 0">
          <li>${s.line_friend_url ? `<a href="${esc(s.line_friend_url)}" target="_blank" rel="noopener">ロジ弁のLINE公式アカウント</a>` : 'ロジ弁のLINE公式アカウント'}を友だち追加する</li>
          <li>下のボタンで連携コード(6けた)を出す</li>
          <li>そのコードをLINEのトークに送る</li>
        </ol>
        <div id="line-code"><button type="button" id="line-issue">連携コードを出す</button></div></div>`;
      document.getElementById('line-issue').onclick = async () => {
        try {
          const r = await api('/api/employee/line-code', { method: 'POST' });
          document.getElementById('line-code').innerHTML = `<div class="sub">連携コード(${r.minutes}分間有効)</div>
            <div style="font-size:2rem;font-weight:700;letter-spacing:.2em">${r.code}</div>
            <p class="sub" style="margin:4px 0 0">LINEのトークにこの数字を送ってください。送ったあと、この画面を開き直すと「連携済み」になります。</p>`;
        } catch (e) { toast(e.message, true); }
      };
    }

    async function refresh() {
      await loadSummary();
      await loadDay();
    }

    const me = await api('/api/me');
    if (me.role !== 'employee') location.href = '/';
    document.getElementById('who').textContent = `${me.company_name} ${me.department || ''} ${me.name} さん`;
    refresh();
  </script>
</body>
</html>
