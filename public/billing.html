<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ロジ弁 請求・支払い</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/print.css">
  <style>@page { size: A4 portrait; margin: 12mm; }</style>
</head>
<body>
  <header>
    <div><h1>🍱 ロジ弁</h1><div class="who">管理画面(達磨商事)</div></div>
    <nav class="nav">
      <a href="/admin.html">注文数</a>
      <a href="/manage.html">登録</a>
      <a href="/print.html">印刷</a>
      <a href="/billing.html" class="active">請求</a>
      <button type="button" id="logout">ログアウト</button>
    </nav>
  </header>
  <main>
    <div class="tabs no-print">
      <button type="button" data-tab="companies" class="active">会社への請求</button>
      <button type="button" data-tab="shops">お店への支払い</button>
    </div>

    <!-- ===== 会社への請求 ===== -->
    <section id="tab-companies">
      <div class="card no-print">
        <div class="row">
          <div><label for="month">対象月(会社への請求は月ごと)</label><select id="month"></select></div>
          <div style="flex:0 0 auto"><button type="button" id="print-invoices">請求明細を印刷(会社ごと)</button></div>
        </div>
        <p class="sub" style="margin-bottom:4px">CSVで保存:</p>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <a class="btn secondary small" id="csv-orders">注文の明細</a>
          <a class="btn secondary small" id="csv-invoices">会社ごとの請求</a>
          <a class="btn secondary small" id="csv-employees">社員ごとの内訳</a>
        </div>
      </div>
      <div id="companies"></div>
    </section>

    <!-- ===== お店への支払い ===== -->
    <section id="tab-shops" hidden>
      <div class="card no-print">
        <div class="row">
          <div><label for="period">期間(お店への支払いは2週間ごと)</label><select id="period"></select></div>
          <div style="flex:0 0 auto;display:flex;gap:6px">
            <a class="btn secondary" id="csv-shops">CSVで保存</a>
            <button type="button" id="print-shops">支払い明細を印刷(お店ごと)</button>
          </div>
        </div>
      </div>
      <div id="shops"></div>
    </section>
  </main>

  <script type="module">
    import { api, yen, esc, logout } from '/common.js';
    document.getElementById('logout').onclick = logout;
    const $ = (id) => document.getElementById(id);

    // ---------- タブ ----------
    document.querySelectorAll('.tabs button').forEach((b) =>
      b.addEventListener('click', () => {
        document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('active', x === b));
        $('tab-companies').hidden = b.dataset.tab !== 'companies';
        $('tab-shops').hidden = b.dataset.tab !== 'shops';
      })
    );

    const monthLabel = (m) => `${m.slice(0, 4)}年${Number(m.slice(5))}月`;
    const dayLabel = (d) => `${Number(d.slice(5, 7))}/${Number(d.slice(8))}`;
    const periodLabel = (p) => `${p.start.slice(0, 4)}年 ${dayLabel(p.start)}〜${dayLabel(p.end)}`;

    // ---------- 対象月の選択肢(今月から12か月前まで) ----------
    const now = new Date(Date.now() + 9 * 3600 * 1000);
    const months = [];
    for (let i = 0; i < 12; i++) {
      const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() - i, 1));
      months.push(d.toISOString().slice(0, 7));
    }
    $('month').innerHTML = months.map((m, i) => `<option value="${m}">${monthLabel(m)}${i === 0 ? '(今月)' : ''}</option>`).join('');
    $('month').onchange = loadCompanies;

    // ================= 会社への請求 =================
    async function loadCompanies() {
      const month = $('month').value;
      $('csv-orders').href = `/api/admin/export/orders.csv?month=${month}`;
      $('csv-invoices').href = `/api/admin/export/companies.csv?month=${month}`;
      $('csv-employees').href = `/api/admin/export/employees.csv?month=${month}`;
      const r = await api('/api/admin/billing/companies?month=' + month);
      const sum = (k) => r.companies.reduce((a, c) => a + c[k], 0);
      const notice = r.complete ? '' : `<div class="notice warn no-print">${monthLabel(month)}はまだ終わっていないため、今日までに入っている注文(この先の予約を含む)での<b>途中経過</b>です。</div>`;
      if (!r.companies.length) {
        $('companies').innerHTML = notice + '<p class="sub">この月の注文はありません。</p>';
        return;
      }
      $('companies').innerHTML = `${notice}
        <div class="card table-wrap no-print"><table>
          <tr><th>会社</th><th class="num">食数</th><th class="num">会社負担分</th><th class="num">利用料</th><th class="num">利用料の消費税</th><th class="num">請求額</th><th class="num">(参考)社員負担</th></tr>
          ${r.companies.map((c) => `<tr><td><a href="#company-${c.company_id}">${esc(c.company_name)}</a></td><td class="num">${c.meals}</td><td class="num">${yen(c.company_share)}</td><td class="num">${yen(c.service_fee)}</td><td class="num">${yen(c.service_tax)}</td><td class="num"><b>${yen(c.total)}</b></td><td class="num">${yen(c.employee_share)}</td></tr>`).join('')}
          <tr class="total"><td>合計</td><td class="num">${sum('meals')}</td><td class="num">${yen(sum('company_share'))}</td><td class="num">${yen(sum('service_fee'))}</td><td class="num">${yen(sum('service_tax'))}</td><td class="num"><b>${yen(sum('total'))}</b></td><td class="num">${yen(sum('employee_share'))}</td></tr>
        </table></div>
        <h2 class="no-print">会社ごとの請求明細</h2>
        ${r.companies.map((c) => invoicePage(c, r)).join('')}`;
    }

    function invoicePage(c, r) {
      return `<div class="page" id="company-${c.company_id}">
        <div class="d-head">
          <div><div class="sub">ロジ弁 ご利用明細 ${monthLabel(r.month)}分${r.complete ? '' : '(途中経過)'}</div>
            <div class="d-company">${esc(c.company_name)} 様</div></div>
          <div style="text-align:right"><div class="sub">ご請求額(税込)</div><div class="d-total">${yen(c.total)}</div></div>
        </div>
        <table class="bill">
          <tr><th>内容</th><th class="num">数量</th><th class="num">金額</th></tr>
          <tr><td>お弁当代 会社ご負担分(税込・軽減税率8%対象)</td><td class="num">${c.meals_bento}食</td><td class="num">${yen(c.company_share_bento)}</td></tr>
          ${c.meals_lunch ? `<tr><td>だるまランチ 会社ご負担分(税込・10%対象)</td><td class="num">${c.meals_lunch}回</td><td class="num">${yen(c.company_share_lunch)}</td></tr>` : ''}
          <tr><td>サービス利用料(${yen(r.service_fee)} × 食数・税抜)</td><td class="num">${c.meals}食</td><td class="num">${yen(c.service_fee)}</td></tr>
          <tr><td>サービス利用料の消費税(10%)</td><td></td><td class="num">${yen(c.service_tax)}</td></tr>
          <tr class="total"><td>合計(税込)</td><td></td><td class="num">${yen(c.total)}</td></tr>
        </table>
        <p class="sub">8%対象 ${yen(c.company_share_bento)}(うち消費税 ${yen(c.company_share_tax)})/ 10%対象 ${yen(c.company_share_lunch + c.service_fee + c.service_tax)}(うち消費税 ${yen(c.company_share_lunch_tax + c.service_tax)})</p>
        <h3>社員ごとの内訳</h3>
        <table class="d-list">
          <tr><th>部署</th><th>社員番号</th><th>名前</th><th class="num">食数</th><th class="num">お食事代</th><th class="num">会社負担</th><th class="num">社員負担</th></tr>
          ${c.employees.map((e) => `<tr><td>${esc(e.department)}</td><td>${esc(e.login_id)}</td><td>${esc(e.user_name)}${e.reached_cap ? ' <span class="badge">上限到達</span>' : ''}</td><td class="num">${e.meals}${e.meals_lunch ? `<br><span class="sub">うちランチ${e.meals_lunch}</span>` : ''}</td><td class="num">${yen(e.bento_total)}</td><td class="num">${yen(e.company_share)}</td><td class="num">${yen(e.employee_share)}</td></tr>`).join('')}
          <tr class="total"><td colspan="3">合計</td><td class="num">${c.meals}</td><td class="num">${yen(c.bento_total)}</td><td class="num">${yen(c.company_share)}</td><td class="num">${yen(c.employee_share)}</td></tr>
        </table>
      </div>`;
    }

    // ================= お店への支払い =================
    let periodsReady = false;
    async function loadShops(start) {
      const r = await api('/api/admin/billing/shops' + (start ? '?start=' + start : ''));
      if (!periodsReady) {
        $('period').innerHTML = r.periods.map((p) => `<option value="${p.start}">${periodLabel(p)}</option>`).join('');
        periodsReady = true;
      }
      $('period').value = r.period.start;
      $('csv-shops').href = `/api/admin/export/shops.csv?start=${r.period.start}`;
      const notice = r.complete ? '' : `<div class="notice warn no-print">この期間はまだ終わっていないため、<b>途中経過</b>です。</div>`;
      if (!r.shops.length) {
        $('shops').innerHTML = notice + '<p class="sub">この期間の注文はありません。</p>';
        return;
      }
      const sum = (k) => r.shops.reduce((a, s) => a + s[k], 0);
      $('shops').innerHTML = `${notice}
        <div class="card table-wrap no-print"><table>
          <tr><th>お店</th><th class="num">食数</th><th class="num">お食事代</th><th class="num">営業代行料(${r.agency_fee_percent}%)</th><th class="num">お支払い額</th></tr>
          ${r.shops.map((s) => `<tr><td><a href="#shop-${s.shop_id}">${esc(s.shop_name)}</a></td><td class="num">${s.meals}</td><td class="num">${yen(s.bento_total)}</td><td class="num">${yen(s.agency_fee)}</td><td class="num"><b>${yen(s.payment)}</b></td></tr>`).join('')}
          <tr class="total"><td>合計</td><td class="num">${sum('meals')}</td><td class="num">${yen(sum('bento_total'))}</td><td class="num">${yen(sum('agency_fee'))}</td><td class="num"><b>${yen(sum('payment'))}</b></td></tr>
        </table></div>
        <h2 class="no-print">お店ごとの支払い明細</h2>
        ${r.shops.map((s) => `<div class="page" id="shop-${s.shop_id}">
          <div class="d-head">
            <div><div class="sub">ロジ弁 お支払い明細 ${periodLabel(r.period)}${r.complete ? '' : '(途中経過)'}</div>
              <div class="d-company">${esc(s.shop_name)} 様</div></div>
            <div style="text-align:right"><div class="sub">お支払い額</div><div class="d-total">${yen(s.payment)}</div></div>
          </div>
          <table class="bill">
            <tr><th>内容</th><th class="num">金額</th></tr>
            <tr><td>お食事代 合計(税込・${s.meals}食${s.meals_lunch ? `、うちだるまランチ ${s.meals_lunch}回` : ''})</td><td class="num">${yen(s.bento_total)}</td></tr>
            <tr><td>営業代行料(お弁当代の${r.agency_fee_percent}%・税込、うち消費税 ${yen(s.agency_fee_tax)})</td><td class="num">− ${yen(s.agency_fee)}</td></tr>
            <tr class="total"><td>お支払い額</td><td class="num">${yen(s.payment)}</td></tr>
          </table>
          <h3>お弁当ごとの数</h3>
          <table class="d-list">
            <tr><th>メニュー</th><th class="num">単価</th><th class="num">数</th><th class="num">小計</th></tr>
            ${s.items.map((i) => `<tr><td>${i.kind === 'daruma_lunch' ? '🍜 ' : ''}${esc(i.item_name)}</td><td class="num">${yen(i.price)}</td><td class="num">${i.count}</td><td class="num">${yen(i.price * i.count)}</td></tr>`).join('')}
          </table>
        </div>`).join('')}`;
    }
    $('period').onchange = () => loadShops($('period').value);

    // ---------- 印刷:見ているタブの明細だけを印刷 ----------
    $('print-invoices').onclick = () => print();
    $('print-shops').onclick = () => print();

    const me = await api('/api/me');
    if (me.role !== 'admin') location.href = '/';
    loadCompanies();
    loadShops();
  </script>
</body>
</html>
