# Cloudflare の設定ファイル
name = "logiben"
main = "src/index.js"
compatibility_date = "2025-10-01"

# 画面(HTML/CSS/JS)は public フォルダから配信
[assets]
directory = "./public"

# データ保管庫(D1 データベース)
# 本番公開時は `npx wrangler d1 create logiben` で作成し、表示された id をここに貼る
[[d1_databases]]
binding = "DB"
database_name = "logiben"
database_id = "6adf2872-881a-411b-bfe9-d79a6bc21c49"

# 秘密ではない設定
[vars]
# LINE公式アカウントの友だち追加URL(社員の注文画面に表示)。決まったら書く
LINE_FRIEND_URL = ""
# "1" = お試し版(ログイン画面にお試し用アカウントを表示)。本番では "0" にする
DEMO_MODE = "1"
# 秘密の設定(LINE_CHANNEL_SECRET, LINE_CHANNEL_ACCESS_TOKEN)はここに書かず、
#   npx wrangler secret put LINE_CHANNEL_SECRET
# のように登録する(README「LINEとつなぐ手順」)
